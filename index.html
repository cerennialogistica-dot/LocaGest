<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão de Locação de Imóveis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon"><i class="fa-solid fa-building"></i></div>
        <div class="brand-text">
          <strong>LocaGest</strong>
          <span>Gestão Imobiliária</span>
        </div>
        <button class="icon-btn sidebar-toggle" id="sidebarToggle" aria-label="Recolher menu">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>

      <nav class="nav-menu" id="navMenu">
        <button class="nav-item active" data-page="dashboard"><i class="fa-solid fa-chart-line"></i><span>Dashboard</span></button>
        <button class="nav-item" data-page="locatarios"><i class="fa-solid fa-users"></i><span>Locatários</span></button>
        <button class="nav-item" data-page="imoveis"><i class="fa-solid fa-house"></i><span>Imóveis</span></button>
        <button class="nav-item" data-page="mensalidades"><i class="fa-solid fa-calendar-check"></i><span>Mensalidades</span></button>
        <button class="nav-item" data-page="recibos"><i class="fa-solid fa-receipt"></i><span>Recibos</span></button>
        <button class="nav-item" data-page="despesas"><i class="fa-solid fa-wallet"></i><span>Despesas</span></button>
        <div class="nav-group">
          <button class="nav-group-toggle" type="button"><i class="fa-solid fa-folder-open"></i><span>Cadastros</span><i class="fa-solid fa-chevron-down group-arrow"></i></button>
          <div class="nav-submenu">
            <button class="nav-item nav-subitem" data-page="condominios"><i class="fa-solid fa-building"></i><span>Condomínios</span></button>
            <button class="nav-item nav-subitem" data-page="contratos"><i class="fa-solid fa-file-contract"></i><span>Contratos</span></button>
          </div>
        </div>
        <div class="nav-group">
          <button class="nav-group-toggle" type="button"><i class="fa-solid fa-gear"></i><span>Configurações</span><i class="fa-solid fa-chevron-down group-arrow"></i></button>
          <div class="nav-submenu">
            <button class="nav-item nav-subitem" data-page="locadores"><i class="fa-solid fa-user"></i><span>Meu cadastro</span></button>
            <button class="nav-item nav-subitem" data-page="configuracoes"><i class="fa-solid fa-sliders"></i><span>Configurações gerais</span></button>
            <button class="nav-subitem nav-logout" type="button" id="sidebarLogout"><i class="fa-solid fa-right-from-bracket"></i><span>Sair</span></button>
          </div>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="user-card">
          <div class="avatar"><i class="fa-solid fa-user"></i></div>
          <div class="user-info"><strong id="currentLocadorName">Locador</strong><span>Ambiente individual</span></div>
          <button class="logout-mini" id="logoutBtn" title="Sair"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <p class="eyebrow">Visão geral</p>
          <h1 id="pageTitle">Dashboard</h1>
        </div>
        <div class="topbar-actions">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="globalSearch" placeholder="Pesquisar no módulo..." />
          </div>
          <button class="primary-btn" id="mainAction"><i class="fa-solid fa-plus"></i><span>Novo cadastro</span></button>
        </div>
      </header>

      <section id="appContent" class="content-area"></section>
    </main>
  </div>

  <div class="mobile-overlay" id="mobileOverlay"></div>
  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="./firebase-config.js"></script>
  <script src="./storage.js"></script>
  <script src="./masks.js"></script>
  <script src="./utils.js"></script>
  <script src="./app.js"></script>
</body>
</html>
