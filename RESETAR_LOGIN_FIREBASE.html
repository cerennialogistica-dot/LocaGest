<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LocaGest - Apagar conta</title>
<style>
body{font-family:Arial,sans-serif;background:#eef3fa;margin:0;min-height:100vh;display:grid;place-items:center;color:#14213d}
.card{width:min(460px,calc(100% - 32px));background:#fff;padding:28px;border-radius:18px;box-shadow:0 20px 50px #0002}
input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;margin-top:10px;font:inherit}
input{border:1px solid #ccd5e1}button{border:0;background:#b42318;color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#245eaa}.msg{margin-top:14px;padding:10px;border-radius:8px;background:#f8fafc;font-size:13px;white-space:pre-wrap}
small{color:#667085}
</style>
</head>
<body>
<div class="card">
<h2>Zerar conta do LocaGest</h2>
<p>Esta tela apaga os dados do Realtime Database e depois exclui o login Firebase informado.</p>
<small>Repita para cada login que desejar excluir. A exclusão é definitiva.</small>
<input id="email" type="email" placeholder="E-mail do login">
<input id="senha" type="password" placeholder="Senha">
<button class="secondary" id="entrar">1. Confirmar login</button>
<button id="apagar" disabled>2. Apagar dados e excluir este login</button>
<div class="msg" id="msg">Aguardando.</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="./firebase-config.js?v=165"></script>
<script>
firebase.initializeApp(window.LOCAGEST_FIREBASE_CONFIG);
const auth=firebase.auth(),db=firebase.database(),msg=document.getElementById('msg'),btn=document.getElementById('apagar');
let user=null;
document.getElementById('entrar').onclick=async()=>{
 try{
  const cred=await auth.signInWithEmailAndPassword(document.getElementById('email').value.trim(),document.getElementById('senha').value);
  user=cred.user; btn.disabled=false; msg.textContent='Login confirmado: '+user.email;
 }catch(e){msg.textContent='Erro ao entrar: '+(e.message||e.code)}
};
btn.onclick=async()=>{
 if(!user)return;
 if(!confirm('ATENÇÃO: apagar permanentemente TODOS os dados e excluir este login?'))return;
 try{
   await db.ref('usuarios/'+user.uid).remove();
   await user.delete();
   localStorage.clear(); sessionStorage.clear();
   btn.disabled=true; msg.textContent='Conta e dados apagados com sucesso.';
 }catch(e){msg.textContent='Erro ao apagar: '+(e.message||e.code)}
};
</script>
</body>
</html>
